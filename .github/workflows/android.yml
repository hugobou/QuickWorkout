name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#15803d' --iconBackgroundColorDark '#15803d' --splashBackgroundColor '#15803d' --splashBackgroundColorDark '#15803d'
          npx cap sync android

      - name: Versión
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma. Mira el README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=Rutinas-$VERSION-${{ github.run_number }}.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm release.keystore
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
